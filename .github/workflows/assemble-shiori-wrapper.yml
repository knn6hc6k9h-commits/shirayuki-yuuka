name: Assemble SHIORI wrapper

on:
  push:
    paths:
      - 'source/shiori_wrapper.c'
      - 'source/shiori_feature6.c'
      - 'source/shiori_wrapper.ready'
      - '.github/workflows/assemble-shiori-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install MinGW compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build wrapper DLL
        shell: bash
        run: |
          i686-w64-mingw32-gcc -shared -Os -s -o docs/update/ghost/master/shiori.dll source/shiori_feature6.c -Wl,--kill-at
          file docs/update/ghost/master/shiori.dll
          test -s docs/update/ghost/master/shiori.dll

      - name: Refresh update manifests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          dll = Path('docs/update/ghost/master/shiori.dll')
          digest = hashlib.md5(dll.read_bytes()).hexdigest()
          size = dll.stat().st_size
          sep = '\x01'

          p = Path('docs/update/updates2.dau')
          lines = p.read_text(encoding='utf-8').splitlines()
          prefix = 'ghost/master/shiori.dll' + sep
          replacement = f'ghost/master/shiori.dll{sep}{digest}{sep}size={size}{sep}'
          lines = [replacement if line.startswith(prefix) else line for line in lines]
          p.write_bytes(('\r\n'.join(lines) + '\r\n').encode('utf-8'))

          p = Path('docs/update/updates.txt')
          lines = p.read_text(encoding='utf-8').splitlines()
          prefix = 'file,ghost/master/shiori.dll' + sep
          replacement = f'file,ghost/master/shiori.dll{sep}{digest}{sep}size={size}{sep}'
          lines = [replacement if line.startswith(prefix) else line for line in lines]
          p.write_bytes(('\r\n'.join(lines) + '\r\n').encode('utf-8'))

          print('shiori.dll MD5:', digest)
          print('shiori.dll size:', size)
          PY

      - name: Rebuild public NAR
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          unzip -q docs/Shirayuki_Yuuka.nar -d "$work"
          rm -rf "$work/ghost" "$work/shell"
          cp -a docs/update/ghost "$work/ghost"
          cp -a docs/update/shell "$work/shell"
          cp docs/update/CUSTOMIZE_README.txt "$work/CUSTOMIZE_README.txt"
          cp docs/update/DIALOGUE_EDIT_GUIDE.txt "$work/DIALOGUE_EDIT_GUIDE.txt"
          cp docs/update/readme.txt "$work/readme.txt"
          cp docs/update/thumbnail.png "$work/thumbnail.png"
          rm -f "$work/ghost/master/yuuka_state.dat" "$work/ghost/master/yuuka_features.dat"
          test -f "$work/install.txt"
          rm -f docs/Shirayuki_Yuuka.nar
          (cd "$work" && zip -q -r "$GITHUB_WORKSPACE/docs/Shirayuki_Yuuka.nar" .)

          nar_shiori="$(unzip -p docs/Shirayuki_Yuuka.nar ghost/master/shiori.dll | md5sum | awk '{print $1}')"
          src_shiori="$(md5sum docs/update/ghost/master/shiori.dll | awk '{print $1}')"
          nar_core="$(unzip -p docs/Shirayuki_Yuuka.nar ghost/master/shiori_core.dll | md5sum | awk '{print $1}')"
          src_core="$(md5sum docs/update/ghost/master/shiori_core.dll | md5sum | awk '{print $1}')"
          test "$nar_shiori" = "$src_shiori"
          test "$nar_core" = "$src_core"
          echo "NAR shiori.dll MD5: $nar_shiori"
          echo "NAR shiori_core.dll MD5: $nar_core"

      - name: Commit built files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/update/ghost/master/shiori.dll docs/update/updates2.dau docs/update/updates.txt docs/Shirayuki_Yuuka.nar
          if git diff --cached --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git commit -m "Build live dialogue reload SHIORI wrapper"
          git pull --rebase origin main
          git push origin main
